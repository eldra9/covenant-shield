name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS Runner & IPA
    runs-on: macos-14 # Apple Silicon cloud runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build iOS Application & Package Artifacts
        run: |
          cd "Guard app/flutter_app"
          chmod +x build_ios_ci.sh
          ./build_ios_ci.sh

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisGuard-iOS-App
          path: Guard app/flutter_app/build-artifacts/*
          retention-days: 14
