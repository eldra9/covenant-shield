name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS Runner & IPA
    runs-on: macos-14 # Apple Silicon macOS runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure iOS platform and dependencies
        run: |
          cd "Guard app/flutter_app"
          flutter create . --platforms=ios --org co.ke.covenantshield
          flutter pub get

      - name: Configure Info.plist permissions
        run: |
          cd "Guard app/flutter_app/ios"
          # Add permissions using PlistBuddy (native macOS tool)
          PLIST="Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'AegisGuard requires location access to verify guard check-ins.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'AegisGuard requires location access for geofence verification.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'AegisGuard requires camera access to scan security entry QR codes.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true

      - name: Build iOS Application (Release, No Codesign)
        run: |
          cd "Guard app/flutter_app"
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd "Guard app/flutter_app"
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r AegisGuard-iOS.ipa Payload
          else
            echo "Runner.app not found in expected directory. Checking build outputs:"
            find build -name "Runner.app" || true
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisGuard-iOS-IPA
          path: Guard app/flutter_app/AegisGuard-iOS.ipa
          retention-days: 14
